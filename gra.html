<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Tablica Graczy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="wspolne.js"></script>
<script src="karty.js"></script>

<style>
  :root{
    --bg: #14161c;
    --bg-panel: #1e212b;
    --bg-panel-raised: #262a36;
    --line: #333748;
    --text: #edeef2;
    --text-dim: #9098a8;
    --text-faint: #5b6172;

    --atak: #e8583d;
    --obrona: #4a9de0;

    --radius: 14px;
    --radius-sm: 8px;
    --font-display: 'Oswald', sans-serif;
    --font-body: 'Inter', sans-serif;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body{
    margin:0; min-height:100vh; background: var(--bg); color: var(--text);
    font-family: var(--font-body); display:flex; justify-content:center;
    padding: 24px 16px 48px;
  }
  #app{ width:100%; max-width: 460px; }
  a, button{ font-family: inherit; }
  button{ cursor:pointer; }
  button:focus-visible{ outline: 2px solid var(--text); outline-offset: 2px; }
  .hidden{ display:none !important; }

  .eyebrow{
    font-family: var(--font-display); letter-spacing: .12em; text-transform: uppercase;
    font-size: 12px; color: var(--text-dim); margin: 0 0 6px;
  }

  /* ---------- pasek gorny ---------- */
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .gear-wrap{ position:relative; }
  .gear-btn{
    background: var(--bg-panel); border:1px solid var(--line); color: var(--text-dim);
    width:42px; height:42px; border-radius:50%; font-size:18px;
    display:flex; align-items:center; justify-content:center;
  }
  .gear-menu{
    position:absolute; top:50px; left:0; background: var(--bg-panel-raised);
    border:1px solid var(--line); border-radius: var(--radius-sm); min-width:210px;
    box-shadow: 0 10px 28px rgba(0,0,0,.45); z-index:20; overflow:hidden;
  }
  .gear-menu button{
    display:block; width:100%; text-align:left; background:none; border:none;
    color: var(--text); padding:13px 15px; font-size:14px;
  }
  .gear-menu button:hover{ background: var(--bg-panel); }
  .gear-menu button.danger{ color: var(--atak); }
  .topbar-team-badge{
    font-family: var(--font-display); font-size:12.5px; letter-spacing:.06em;
    text-transform:uppercase; color: var(--team-color, var(--text-dim));
    background: var(--bg-panel); border:1px solid var(--line); border-radius:999px; padding:8px 14px;
  }

  /* ---------- tura / runda ---------- */
  .turn-pill{
    display:flex; align-items:center; gap:9px; background: var(--bg-panel); border:1px solid var(--line);
    border-radius: 999px; padding: 10px 15px; font-size: 13px; color: var(--text-dim); margin-bottom: 8px;
  }
  .turn-dot{ width:9px; height:9px; border-radius:50%; background: var(--turn-color, var(--text-faint)); flex-shrink:0; }
  .turn-pill strong{ color: var(--text); font-weight:600; }
  .turn-pill.mine{ border-color: var(--turn-color); }
  .round-label{ font-size:12px; color: var(--text-faint); text-align:center; margin-bottom:18px; }

  /* ---------- zloto / statystyki ---------- */
  .stat-card{
    background: var(--bg-panel); border:1px solid var(--line); border-radius: var(--radius);
    padding: 16px 18px; margin-bottom:16px;
  }
  .gold-row{ font-family: var(--font-display); font-size:20px; font-weight:600; margin-bottom:12px; }
  .gold-row strong{ color:#f5c451; }
  .unit-stat-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:7px 0; border-top:1px solid var(--line); font-size:13.5px;
  }
  .unit-stat-row:first-of-type{ border-top:none; }
  .unit-stat-name{ color: var(--text-dim); }
  .unit-stat-mods{ color: var(--text); font-variant-numeric: tabular-nums; }
  .unit-stat-mods .zero{ color: var(--text-faint); }

  /* ---------- karty specjalne ---------- */
  .special-hand{ margin-bottom:18px; }
  .special-hand h3{
    font-family: var(--font-display); font-size:13px; text-transform:uppercase;
    letter-spacing:.06em; color: var(--text-dim); margin:0 0 9px;
  }
  .chip-row{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{
    background: var(--bg-panel-raised); border:1px solid var(--line); border-radius:999px;
    padding:5px 8px 5px 12px; font-size:12.5px; color: var(--text); display:flex; align-items:center; gap:6px;
  }
  .chip-remove{
    background:none; border:none; color: var(--text-faint); font-size:12px; padding:2px 4px; line-height:1;
  }
  .chip-remove:hover{ color: var(--atak); }
  .roster-empty{ font-size:13px; color: var(--text-faint); font-style:italic; }

  /* ---------- akcje ---------- */
  .action-btn{
    display:block; width:100%; background: var(--bg-panel); border:1px solid var(--line);
    color: var(--text); border-radius: var(--radius-sm); padding: 14px; font-size: 14.5px;
    font-weight:500; margin-bottom:10px; text-align:left;
  }
  .action-btn:hover{ background: var(--bg-panel-raised); }

  .attack-heading{
    font-family: var(--font-display); font-size:13px; text-transform:uppercase;
    letter-spacing:.06em; color: var(--atak); margin:18px 0 9px;
  }
  .attack-btn{
    display:block; width:100%; background: rgba(232,88,61,.12); border:1px solid var(--atak);
    color: #ffb3a3; border-radius: var(--radius-sm); padding: 14px; font-size: 14.5px;
    font-weight:600; margin-bottom:10px; text-align:left;
  }
  .attack-btn:hover{ background: rgba(232,88,61,.22); }

  .slot{
    display:flex; align-items:center; gap:14px; width:100%;
    background: var(--bg-panel); border: 1px solid var(--line);
    border-left: 5px solid var(--team-color, var(--text-faint));
    border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 10px; text-align:left;
  }
  .slot-name{ font-weight:600; font-size:14.5px; }
  .slot-arrow{ color: var(--text-faint); font-size:18px; margin-left:auto; }

  .ghost-btn{
    display:block; width:100%; background: transparent; border: 1px solid var(--line);
    color: var(--text-dim); border-radius: var(--radius-sm); padding: 12px 14px;
    font-size: 13.5px; font-weight:500; margin-bottom:10px; text-align:center;
  }
  .ghost-btn:hover{ border-color: var(--text-faint); color: var(--text); }

  #end-turn-btn{
    display:block; width:100%; background: var(--team-color); color: #14161c; border:none;
    border-radius: var(--radius-sm); padding: 14px; font-family: var(--font-display); font-size: 15px;
    font-weight:600; letter-spacing:.03em; text-transform:uppercase; margin-top: 20px;
  }

  .placeholder-card{
    background: var(--bg-panel); border: 1px dashed var(--line); border-radius: var(--radius);
    padding: 26px 20px; text-align:center; color: var(--text-faint); font-size: 14px; line-height:1.6;
  }

  /* ---------- panel zakupow ---------- */
  .shop-panel{
    background: var(--bg-panel); border:1px solid var(--line); border-radius: var(--radius);
    padding: 16px; margin: -2px 0 10px;
  }
  .shop-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:8px 0; border-top:1px solid var(--line);
  }
  .shop-row:first-child{ border-top:none; }
  .shop-row label{ font-size:14px; color: var(--text); }
  .shop-price{ font-size:11.5px; color: var(--text-faint); display:block; }
  .shop-row input[type="number"]{
    width:64px; background: var(--bg-panel-raised); border:1px solid var(--line); color: var(--text);
    border-radius: var(--radius-sm); padding:8px; font-size:15px; text-align:center;
    font-family: var(--font-body);
  }
  .shop-row input[type="number"]:focus{ outline: 2px solid var(--obrona); }
  .shop-total{
    font-family: var(--font-display); font-size:16px; font-weight:600;
    text-align:right; margin:12px 0 14px; color:#f5c451;
  }
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="gear-wrap">
      <button class="gear-btn" id="gear-btn">⚙️</button>
      <div class="gear-menu hidden" id="gear-menu">
        <button class="danger" id="end-game-btn">🗑️ Zakończ rozgrywkę</button>
      </div>
    </div>
    <div class="topbar-team-badge" id="my-badge">Gracz</div>
  </div>

  <div class="turn-pill" id="turn-pill">
    <span class="turn-dot" id="turn-dot"></span>
    <span>Tura: <strong id="turn-name">—</strong></span>
  </div>
  <p class="round-label" id="round-label"></p>

  <div class="stat-card">
    <div class="gold-row">💰 Złoto: <strong id="gold-value">0</strong></div>
    <div id="unit-stats"></div>
  </div>

  <div class="special-hand">
    <h3>🎴 Twoje karty specjalne (<span id="hand-count">0</span>/6)</h3>
    <button class="ghost-btn" id="discard-special-btn">Odrzuć jedną kartę</button>
  </div>

  <div id="my-turn-actions" class="hidden">
    <button class="action-btn" id="add-card-btn">➕ Dodaj kartę</button>

    <button class="action-btn" id="shop-btn">🛒 Zakupy</button>
    <div id="shop-panel" class="shop-panel hidden">
      <div class="shop-row"><label for="shop-wojownicy">Wojownicy <span class="shop-price" id="price-wojownicy"></span></label><input type="number" id="shop-wojownicy" min="0" value="0"></div>
      <div class="shop-row"><label for="shop-lancjerzy">Lancjerzy <span class="shop-price" id="price-lancjerzy"></span></label><input type="number" id="shop-lancjerzy" min="0" value="0"></div>
      <div class="shop-row"><label for="shop-lucznicy">Łucznicy <span class="shop-price" id="price-lucznicy"></span></label><input type="number" id="shop-lucznicy" min="0" value="0"></div>
      <div class="shop-row"><label for="shop-specjalne">Karty specjalne <span class="shop-price" id="price-specjalne"></span></label><input type="number" id="shop-specjalne" min="0" value="0"></div>
      <div class="shop-total">Koszt łączny: <strong id="shop-total-value">0</strong> złota</div>
      <button class="ghost-btn" id="shop-confirm-btn" style="border-color:var(--obrona);color:var(--text);">Potwierdź zakup</button>
      <button class="ghost-btn" id="shop-cancel-btn">Anuluj</button>
    </div>

    <div id="attack-section"></div>

    <button id="end-turn-btn">Zakończ turę →</button>
  </div>

  <div id="not-my-turn-card" class="placeholder-card hidden">
    ⏳ Nie Twoja tura — poczekaj, aż gracz na ruchu zakończy swoją turę.
  </div>

</div>

<script>
/* ============================================================
   Baza kart żyje teraz w osobnym pliku karty.js (stała KARTY),
   dołączonym w <head>. Nie trzeba tu nic definiować.
   ============================================================ */

// Przykladowe ceny - do zmiany, gdy bedziesz mial docelowy cennik.
const UNIT_PRICES = { wojownicy: 5, lancjerzy: 6, lucznicy: 7 };
const SPECIAL_CARD_COST = 15;

const UNIT_LABEL = { wojownicy: "Wojownicy", lancjerzy: "Lancjerzy", lucznicy: "Łucznicy" };

document.title = GAME_TITLE;
const el = (id) => document.getElementById(id);

let gameState = { lobbyOpened: false, started: false, turnOrder: [], turnCounter: 0, mainGateOpen: false, rearGateOpen: false };
let playersData = {};
let gameStateLoaded = false;
let playersLoaded = false;
let identity = getMyIdentity();
let pendingAttackType = null; // "brama_glowna" | "brama_tylna" | "zwykly" | null
let navigating = false; // zabezpieczenie przed wielokrotnym przekierowaniem z tej samej karty

function playersByTeam(team) { return playersByTeamFrom(playersData, team); }

function attackTypeLabel(type) {
  return type === "brama_glowna" ? "główna brama" : type === "brama_tylna" ? "tylne wejście" : "zwykły atak";
}

/* ---------- ochrona dostepu: jesli stan gry nie pasuje, wracamy do lobby ---------- */
function checkAccessAnd() {
  if (!isConfigured || navigating) return;
  if (!gameStateLoaded || !playersLoaded) return; // czekamy, az obie paczki danych sie zaladuja
  if (!gameState.lobbyOpened || !gameState.started) { navigating = true; window.location.href = "index.html"; return; }
  if (!identity.id || !playersData[identity.id]) { navigating = true; window.location.href = "index.html"; return; }
  renderAll();
}

/* ---------- render ---------- */
function renderAll() {
  const me = playersData[identity.id];

  el("my-badge").textContent = TEAM_ICON[me.team] + " " + TEAM_LABEL[me.team] + " — " + me.name;
  el("my-badge").style.setProperty("--team-color", "var(--" + me.team + ")");

  const order = gameState.turnOrder || [];
  const total = order.length || 1;
  const idx = gameState.turnCounter % total;
  const currentId = order[idx];
  const current = playersData[currentId];
  const isMyTurn = currentId === identity.id;
  const round = Math.floor(gameState.turnCounter / total) + 1;

  const turnColor = current ? "var(--" + current.team + ")" : "var(--text-faint)";
  el("turn-pill").classList.toggle("mine", isMyTurn);
  el("turn-pill").style.setProperty("--turn-color", turnColor);
  el("turn-name").textContent = isMyTurn ? "Ty" : (current ? current.name : "—");
  el("round-label").textContent = "Runda " + round + " / 50" + (round <= 10 ? " · faza budowy (bez szturmu na bramy)" : "");

  el("gold-value").textContent = (me.gold || 0);

const mods = me.statMods || defaultStatMods();
  el("unit-stats").innerHTML = Object.keys(UNIT_LABEL).map((u) => {
    const stats = effectiveUnitStats(me, u);
    return `<div class="unit-stat-row"><span class="unit-stat-name">${UNIT_LABEL[u]}</span><span class="unit-stat-mods">atak ${stats.atk} · zdrowie ${stats.hp}</span></div>`;
  }).join("");

  const specialCount = me.specialCardCount || 0;
  el("hand-count").textContent = specialCount;
  el("discard-special-btn").disabled = specialCount <= 0;
  el("discard-special-btn").style.opacity = specialCount <= 0 ? .5 : 1;

  const endBtn = el("end-turn-btn");
  endBtn.style.setProperty("--team-color", "var(--" + me.team + ")");

  el("my-turn-actions").classList.toggle("hidden", !isMyTurn);
  el("not-my-turn-card").classList.toggle("hidden", isMyTurn);

  if (isMyTurn) renderAttackSection(me, round);
}

/* ---------- sekcja ataku (tylko druzyna atakujaca) ---------- */
function renderAttackSection(me, round) {
  const wrap = el("attack-section");
  if (me.team !== "atak") { wrap.innerHTML = ""; return; }

  let html = `<h3 class="attack-heading">Atak</h3>`;

  if (pendingAttackType) {
    const defenders = playersByTeam("obrona");
    html += `<p style="font-size:13px;color:var(--text-dim);margin-bottom:10px;">Wybierz cel (${attackTypeLabel(pendingAttackType)}):</p>`;
    html += defenders.length
      ? defenders.map(d => `<button class="slot target-btn" style="--team-color:var(--obrona)" data-id="${d.id}"><span class="slot-name">${escapeHtml(d.name)}</span><span class="slot-arrow">›</span></button>`).join("")
      : `<p class="roster-empty">Brak graczy w drużynie broniącej.</p>`;
    html += `<button class="ghost-btn" id="cancel-attack-btn">Anuluj</button>`;
  } else {
    if (round > 10 && !gameState.mainGateOpen) html += `<button class="attack-btn" data-type="brama_glowna">⚔️ Atak na główną bramę</button>`;
    if (round > 10 && !gameState.rearGateOpen) html += `<button class="attack-btn" data-type="brama_tylna">⚔️ Atak na tylne wejście</button>`;
    html += `<button class="attack-btn" data-type="zwykly">⚔️ Zwykły atak na wojska</button>`;
  }

  wrap.innerHTML = html;

  if (pendingAttackType) {
    wrap.querySelectorAll(".target-btn").forEach(btn => btn.addEventListener("click", () => pickTarget(btn.dataset.id)));
    const cancelBtn = document.getElementById("cancel-attack-btn");
    if (cancelBtn) cancelBtn.addEventListener("click", () => { pendingAttackType = null; renderAll(); });
  } else {
    wrap.querySelectorAll(".attack-btn").forEach(btn => btn.addEventListener("click", () => { pendingAttackType = btn.dataset.type; renderAll(); }));
  }
}

async function pickTarget(defenderId) {
  const type = pendingAttackType;
  pendingAttackType = null;
  if (type !== "zwykly") {
    alert("Szturm na bramy pojawi się w kolejnym kroku — na razie dostępny jest tylko zwykły atak.");
    renderAll();
    return;
  }
  navigating = true;
  await db.collection("battle").doc("current").set({
    status: "prep",
    attackerId: identity.id,
    defenderId: defenderId,
    prep: {
      [identity.id]: emptyPrepEntry(),
      [defenderId]: emptyPrepEntry()
    }
  });
  window.location.href = "walka.html";
}

function emptyPrepEntry() {
  return {
    ready: false,
    own: { wojownicy: 0, lancjerzy: 0, lucznicy: 0 },
    allyId: null,
    ally: { wojownicy: 0, lancjerzy: 0, lucznicy: 0 },
    specialCards: []
  };
}

/* ---------- akcje ---------- */
async function addCard() {
  const raw = prompt("Podaj kod karty, którą ciągnąłeś/aś, albo kod trzymanej karty specjalnej, którą chcesz teraz zagrać:");
  if (!raw) return;
  const code = raw.trim();
  const card = KARTY[code];
  if (!card) { alert("Nieznany kod karty: " + code); return; }
  if (card.kategoria === "specjalna" && card.uzycie === "walka") {
    alert("Ta karta jest przeznaczona do użycia w trakcie walki (wnosisz ją w przygotowaniu do walki), nie tutaj.");
    return;
  }

  const ref = db.collection("players").doc(identity.id);

  if (card.kategoria === "ekonomia") {
    await ref.update({ gold: firebase.firestore.FieldValue.increment(card.efekt.zloto) });
    alert("Zastosowano: " + card.nazwa + " (" + (card.efekt.zloto >= 0 ? "+" : "") + card.efekt.zloto + " złota)");
  } else if (card.kategoria === "wojsko") {
    const path = "statMods." + card.efekt.jednostka + "." + card.efekt.staty;
    await ref.update({ [path]: firebase.firestore.FieldValue.increment(card.efekt.wartosc) });
    alert("Zastosowano: " + card.nazwa + " (" + UNIT_LABEL[card.efekt.jednostka] + " " + card.efekt.staty + " " + (card.efekt.wartosc >= 0 ? "+" : "") + card.efekt.wartosc + ")");
  } else if (card.kategoria === "specjalna" && card.uzycie === "gra") {
    const me = playersData[identity.id];
    const count = me.specialCardCount || 0;
    if (count <= 0) { alert('Nie masz żadnych kart specjalnych w ręku — najpierw kup przynajmniej jedną przez "🛒 Zakupy".'); return; }
    const path = "statMods." + card.efekt.jednostka + "." + card.efekt.staty;
    await ref.update({
      [path]: firebase.firestore.FieldValue.increment(card.efekt.wartosc),
      specialCardCount: firebase.firestore.FieldValue.increment(-1)
    });
    alert("Zagrano kartę specjalną: " + card.nazwa + " (" + UNIT_LABEL[card.efekt.jednostka] + " " + card.efekt.staty + " " + (card.efekt.wartosc >= 0 ? "+" : "") + card.efekt.wartosc + "). Liczba kart w ręku spadła o 1.");
  }
}

function openShop() {
  ["shop-wojownicy", "shop-lancjerzy", "shop-lucznicy", "shop-specjalne"].forEach(id => { el(id).value = 0; });
  el("price-wojownicy").textContent = "(" + UNIT_PRICES.wojownicy + "/szt.)";
  el("price-lancjerzy").textContent = "(" + UNIT_PRICES.lancjerzy + "/szt.)";
  el("price-lucznicy").textContent = "(" + UNIT_PRICES.lucznicy + "/szt.)";
  el("price-specjalne").textContent = "(" + SPECIAL_CARD_COST + "/szt.)";
  updateShopTotal();
  el("shop-panel").classList.remove("hidden");
}
function closeShop() {
  el("shop-panel").classList.add("hidden");
}
function updateShopTotal() {
  const w = parseInt(el("shop-wojownicy").value) || 0;
  const l = parseInt(el("shop-lancjerzy").value) || 0;
  const lu = parseInt(el("shop-lucznicy").value) || 0;
  const sp = parseInt(el("shop-specjalne").value) || 0;
  const total = w * UNIT_PRICES.wojownicy + l * UNIT_PRICES.lancjerzy + lu * UNIT_PRICES.lucznicy + sp * SPECIAL_CARD_COST;
  el("shop-total-value").textContent = total;
}
async function confirmShop() {
  const w = parseInt(el("shop-wojownicy").value) || 0;
  const l = parseInt(el("shop-lancjerzy").value) || 0;
  const lu = parseInt(el("shop-lucznicy").value) || 0;
  const sp = parseInt(el("shop-specjalne").value) || 0;
  const total = w * UNIT_PRICES.wojownicy + l * UNIT_PRICES.lancjerzy + lu * UNIT_PRICES.lucznicy + sp * SPECIAL_CARD_COST;
  if (total <= 0) { closeShop(); return; }

  const me = playersData[identity.id];
  const currentGold = me.gold || 0;
  const currentSpecial = me.specialCardCount || 0;

  if (total > currentGold) { alert("Nie masz tyle złota (masz " + currentGold + ", potrzebujesz " + total + ")."); return; }
  if (currentSpecial + sp > 6) { alert("Za dużo kart specjalnych — maksymalnie 6 w ręku (masz " + currentSpecial + ", próbujesz kupić " + sp + ")."); return; }

  await db.collection("players").doc(identity.id).update({
    gold: firebase.firestore.FieldValue.increment(-total),
    specialCardCount: firebase.firestore.FieldValue.increment(sp)
  });

  let summary = [];
  if (w) summary.push(w + " wojowników");
  if (l) summary.push(l + " lancjerów");
  if (lu) summary.push(lu + " łuczników");
  if (sp) summary.push(sp + " kart specjalnych");
  alert("Kupiono: " + summary.join(", ") + " za łącznie " + total + " złota." + (w || l || lu ? "\nPamiętaj, żeby fizycznie dodać jednostki na planszy." : ""));
  closeShop();
}

async function discardOneSpecialCard() {
  const me = playersData[identity.id];
  const count = me.specialCardCount || 0;
  if (count <= 0) return;
  if (!confirm("Odrzucić jedną kartę specjalną z ręki?")) return;
  await db.collection("players").doc(identity.id).update({ specialCardCount: firebase.firestore.FieldValue.increment(-1) });
}

async function endTurn() {
  pendingAttackType = null;
  closeShop();
  await db.collection("game").doc("state").update({
    turnCounter: firebase.firestore.FieldValue.increment(1)
  });
}

/* ---------- start ---------- */
if (isConfigured) {
  db.collection("game").doc("state").onSnapshot((doc) => {
    gameState = doc.exists ? Object.assign({ lobbyOpened: false, started: false, turnOrder: [], turnCounter: 0, mainGateOpen: false, rearGateOpen: false }, doc.data()) : gameState;
    gameStateLoaded = true;
    checkAccessAndRender();
  }, (err) => { console.error("Błąd połączenia (game/state):", err); });

  db.collection("players").onSnapshot((snap) => {
    playersData = {};
    snap.forEach((doc) => { playersData[doc.id] = doc.data(); });
    playersLoaded = true;
    checkAccessAndRender();
  }, (err) => { console.error("Błąd połączenia (players):", err); });

  db.collection("battle").doc("current").onSnapshot((doc) => {
    if (navigating || !doc.exists) return;
    const b = doc.data();
    if (b.status && b.status !== "finished" && (b.attackerId === identity.id || b.defenderId === identity.id)) {
      navigating = true;
      window.location.href = "walka.html";
    }
  }, (err) => { console.error("Błąd połączenia (battle):", err); });

  el("add-card-btn").addEventListener("click", addCard);
  el("shop-btn").addEventListener("click", openShop);
  el("shop-cancel-btn").addEventListener("click", closeShop);
  el("shop-confirm-btn").addEventListener("click", confirmShop);
  ["shop-wojownicy", "shop-lancjerzy", "shop-lucznicy", "shop-specjalne"].forEach(id => {
    el(id).addEventListener("input", updateShopTotal);
  });
  el("discard-special-btn").addEventListener("click", discardOneSpecialCard);
  el("end-turn-btn").addEventListener("click", endTurn);
  el("end-game-btn").addEventListener("click", endGame);
  setupGearMenu("gear-btn", "gear-menu");
} else {
  document.body.innerHTML = '<p style="color:#f3c9c0;padding:40px;text-align:center;">Brak konfiguracji Firebase w wspolne.js</p>';
}
</script>
</body>
</html>
